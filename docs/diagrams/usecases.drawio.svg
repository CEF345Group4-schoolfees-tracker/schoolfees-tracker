<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 980" width="1380" height="980" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">School Fees Tracker: use case diagram</title>
  <desc id="desc">UML use case diagram. System boundary "School Fees Tracker". Actors: Administrator and Bursar (staff, left), Payer and Mobile Money Provider (external, right). Use cases inside the boundary; dashed include arrows (labelled «include») connect payment use cases to Generate receipt; the Administrator's link to Review online payments is view-only.</desc>

  <defs>
    <marker id="arrowOpen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="strokeWidth">
      <path d="M 1,1 L 11,6 L 1,11" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1380" height="980" fill="#ffffff"/>
  <text x="396" y="26" font-size="13" fill="#475569">Use case diagram: School Fees Tracker (CEF 345, Week 4)</text>

  <!-- system boundary -->
  <rect x="396" y="50" width="408" height="812" rx="14" fill="#f8fafc" stroke="#33475b" stroke-width="2"/>
  <text x="420" y="82" font-size="19" font-weight="700" fill="#1f3a5f">School Fees Tracker</text>

  <!-- actor associations (drawn first so ellipses cover the endpoints) -->
  <g stroke="#3a4a5f" stroke-width="1.7" opacity="0.92" fill="none">
    <!-- Administrator -->
    <line x1="212" y1="110" x2="467" y2="120"/>
    <line x1="212" y1="115" x2="467" y2="180"/>
    <line x1="212" y1="120" x2="467" y2="238"/>
    <line x1="212" y1="125" x2="467" y2="296"/>
    <line x1="212" y1="130" x2="467" y2="354"/>
    <line x1="212" y1="135" x2="467" y2="528"/>
    <line x1="212" y1="140" x2="467" y2="586"/>
    <line x1="212" y1="145" x2="467" y2="644"/>
    <!-- Bursar -->
    <line x1="212" y1="450" x2="467" y2="128"/>
    <line x1="212" y1="455" x2="467" y2="300"/>
    <line x1="212" y1="460" x2="467" y2="358"/>
    <line x1="212" y1="465" x2="467" y2="412"/>
    <line x1="212" y1="470" x2="467" y2="532"/>
    <line x1="212" y1="475" x2="467" y2="590"/>
    <line x1="212" y1="480" x2="467" y2="648"/>
    <line x1="212" y1="485" x2="467" y2="830"/>
    <!-- Payer -->
    <line x1="1090" y1="662" x2="733" y2="702"/>
    <!-- Mobile Money Provider -->
    <line x1="1090" y1="854" x2="733" y2="766"/>
  </g>

  <!-- Administrator: view-only association (dashed) -->
  <line x1="212" y1="150" x2="467" y2="824" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="7 5"/>
  <text x="340" y="484" font-size="11" fill="#4b5563" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">view only</text>

  <!-- use cases -->
  <g fill="#eaf1fa" stroke="#2c4a6b" stroke-width="1.8">
    <ellipse cx="600" cy="124" rx="133" ry="23"/>
    <ellipse cx="600" cy="182" rx="133" ry="23"/>
    <ellipse cx="600" cy="240" rx="133" ry="23"/>
    <ellipse cx="600" cy="298" rx="133" ry="23"/>
    <ellipse cx="600" cy="356" rx="133" ry="23"/>
    <ellipse cx="600" cy="414" rx="133" ry="23"/>
    <ellipse cx="600" cy="472" rx="133" ry="23"/>
    <ellipse cx="600" cy="530" rx="133" ry="23"/>
    <ellipse cx="600" cy="588" rx="133" ry="23"/>
    <ellipse cx="600" cy="646" rx="133" ry="23"/>
    <ellipse cx="600" cy="704" rx="133" ry="23"/>
    <ellipse cx="600" cy="762" rx="133" ry="25"/>
    <ellipse cx="600" cy="828" rx="133" ry="23"/>
  </g>
  <g fill="#14263a" font-size="13" text-anchor="middle">
    <text x="600" y="129">Log in</text>
    <text x="600" y="187">Manage user accounts</text>
    <text x="600" y="245">Manage classes</text>
    <text x="600" y="303">Configure fees</text>
    <text x="600" y="361">Register pupil</text>
    <text x="600" y="419">Record manual payment</text>
    <text x="600" y="477">Generate receipt</text>
    <text x="600" y="535">View payment history</text>
    <text x="600" y="593">Check outstanding balances</text>
    <text x="600" y="651">Generate financial report</text>
    <text x="600" y="709">Pay fees online</text>
    <text x="600" y="756" font-size="12.5">Confirm online payment</text>
    <text x="600" y="772" font-size="11.5" fill="#33475b">(provider callback)</text>
    <text x="600" y="833">Review online payments</text>
  </g>

  <!-- <<include>> arrows: receipt is generated after a successful payment -->
  <path d="M 467,410 H 437 V 470 H 462" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowOpen)"/>
  <path d="M 733,758 H 766 V 470 H 738" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowOpen)"/>
  <text x="430" y="443" font-size="11" font-style="italic" fill="#b45309" text-anchor="middle" transform="rotate(-90 430 440)">«include»</text>
  <text x="777" y="616" font-size="11" font-style="italic" fill="#b45309" text-anchor="middle" transform="rotate(-90 777 612)">«include»</text>

  <!-- actors -->
  <g stroke="#16324a" stroke-width="2.5" fill="#ffffff" stroke-linecap="round">
    <!-- Administrator -->
    <circle cx="180" cy="96" r="12"/>
    <line x1="180" y1="108" x2="180" y2="158"/>
    <line x1="150" y1="126" x2="210" y2="126"/>
    <line x1="180" y1="158" x2="155" y2="200"/>
    <line x1="180" y1="158" x2="205" y2="200"/>
    <!-- Bursar -->
    <circle cx="180" cy="436" r="12"/>
    <line x1="180" y1="448" x2="180" y2="498"/>
    <line x1="150" y1="466" x2="210" y2="466"/>
    <line x1="180" y1="498" x2="155" y2="540"/>
    <line x1="180" y1="498" x2="205" y2="540"/>
    <!-- Payer -->
    <circle cx="1120" cy="636" r="12"/>
    <line x1="1120" y1="648" x2="1120" y2="698"/>
    <line x1="1090" y1="666" x2="1150" y2="666"/>
    <line x1="1120" y1="698" x2="1095" y2="740"/>
    <line x1="1120" y1="698" x2="1145" y2="740"/>
    <!-- Mobile Money Provider (secondary system) -->
    <circle cx="1120" cy="838" r="11"/>
    <line x1="1120" y1="849" x2="1120" y2="895"/>
    <line x1="1092" y1="866" x2="1148" y2="866"/>
    <line x1="1120" y1="895" x2="1097" y2="935"/>
    <line x1="1120" y1="895" x2="1143" y2="935"/>
  </g>
  <g fill="#16324a" font-weight="700" text-anchor="middle">
    <text x="180" y="222" font-size="15">Administrator</text>
    <text x="180" y="562" font-size="15">Bursar</text>
    <text x="1120" y="762" font-size="15">Payer</text>
    <text x="1120" y="957" font-size="13">Mobile Money Provider</text>
  </g>
  <g fill="#475569" text-anchor="middle" font-size="12">
    <text x="1120" y="779">(parent/guardian)</text>
    <text x="1120" y="795">online payments only</text>
    <text x="1120" y="973">(secondary system)</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#33475b">
    <line x1="44" y1="868" x2="86" y2="868" stroke="#3a4a5f" stroke-width="1.7"/>
    <text x="94" y="873">Actor association</text>
    <line x1="44" y1="890" x2="86" y2="890" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="94" y="895">«include» (receipt after a payment)</text>
    <line x1="44" y1="912" x2="86" y2="912" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="7 5"/>
    <text x="94" y="917">View-only (Administrator, DD-28)</text>
  </g>
</svg>
